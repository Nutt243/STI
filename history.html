<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockMaster - ประวัติการเบิก</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800">

  <!-- Navbar -->
  <nav class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <div class="bg-blue-600 p-2 rounded-xl text-white font-black text-lg tracking-wider">SM</div>
          <span class="font-bold text-lg tracking-tight">StockMaster</span>
        </div>

        <div class="hidden md:flex items-center space-x-1">
          <a href="index.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800">หน้าหลัก</a>
          <a href="requisition.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800">เบิกสินค้า</a>
          <a href="history.html" class="px-3 py-2 rounded-lg text-sm font-medium bg-blue-600 text-white">ประวัติการเบิก</a>
          <a href="approvals.html" class="admin-only hidden px-3 py-2 rounded-lg text-sm font-medium text-amber-400 hover:bg-slate-800">อนุมัติคำขอ</a>
          <a href="admin-unregistered-skus.html" class="admin-only hidden px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800">รับสินค้าเข้า & คัดแยก</a>
        </div>

        <div class="flex items-center space-x-3">
          <span id="userDisplayName" class="text-xs text-slate-300 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">Loading...</span>
          <button id="btnLogout" class="text-xs text-rose-400 hover:text-rose-300 font-semibold px-2 py-1">ออกจากระบบ</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight">📜 ประวัติการขอเบิกสินค้า</h1>
        <p class="text-xs text-slate-500 mt-1">ติดตามสถานะรายการเบิก รายละเอียดจำนวนที่ขอ vs จำนวนที่ได้รับจริง</p>
      </div>
    </div>

    <div id="historyList" class="space-y-4">
      <div class="bg-white p-8 rounded-2xl text-center text-slate-400">กำลังโหลดรายการ...</div>
    </div>
  </main>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import { checkUserAuth } from "./js/auth.js";
    import { collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    checkUserAuth();

    async function loadHistory() {
      const container = document.getElementById("historyList");
      try {
        const q = query(collection(db, "requisitions"), orderBy("createdAt", "desc"));
        const snap = await getDocs(q);
        container.innerHTML = "";

        if (snap.empty) {
          container.innerHTML = `<div class="bg-white p-12 rounded-2xl text-center text-slate-400 font-bold">ยังไม่มีประวัติการเบิกสินค้า</div>`;
          return;
        }

        snap.forEach(d => {
          const req = d.data();
          const dateStr = req.createdAt ? new Date(req.createdAt.seconds * 1000).toLocaleString('th-TH') : "-";
          
          let statusBadge = "";
          let isPartial = false;

          // ตรวจสอบว่าอนุมัติแล้วได้ของครบทุกรายการหรือไม่
          if (req.status === "approved") {
            isPartial = (req.items || []).some(i => (i.approvedQty !== undefined && i.approvedQty < i.quantity));
            
            if (isPartial) {
              statusBadge = `<span class="bg-amber-100 text-amber-800 text-xs px-2.5 py-1 rounded-full font-bold">⚠️ อนุมัติ (จ่ายบางส่วน *)</span>`;
            } else {
              statusBadge = `<span class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded-full font-bold">✅ อนุมัติ (จ่ายครบ)</span>`;
            }
          } else if (req.status === "rejected") {
            statusBadge = `<span class="bg-rose-100 text-rose-800 text-xs px-2.5 py-1 rounded-full font-bold">❌ ไม่อนุมัติ</span>`;
          } else {
            statusBadge = `<span class="bg-slate-100 text-slate-700 text-xs px-2.5 py-1 rounded-full font-bold">⏳ รออนุมัติ</span>`;
          }

          // แสดงรายการสินค้าแบบเปรียบเทียบ จำนวนที่ขอ vs จำนวนที่ได้
          const itemsRows = (req.items || []).map(i => {
            const attrStr = Object.entries(i.attributes || {}).map(([k,v]) => `${k}:${v}`).join(", ") || "ทั่วไป";
            const reqQty = i.quantity;
            const appQty = (req.status === "pending") ? "-" : (i.approvedQty !== undefined ? i.approvedQty : i.quantity);
            const isItemShortage = (req.status === "approved" && i.approvedQty !== undefined && i.approvedQty < i.quantity);

            return `
              <tr class="${isItemShortage ? 'bg-amber-50/60' : 'border-b border-slate-100'}">
                <td class="py-2.5 px-3">
                  <div class="font-bold text-slate-800">${i.sku_name} ${isItemShortage ? '<span class="text-amber-600 font-black">*</span>' : ''}</div>
                  <div class="text-[10px] text-slate-400">${attrStr}</div>
                </td>
                <td class="py-2.5 px-3 text-center font-bold text-slate-600">${reqQty} ${i.unit || 'ชิ้น'}</td>
                <td class="py-2.5 px-3 text-center font-bold ${isItemShortage ? 'text-amber-600 font-black' : 'text-emerald-600'}">
                  ${appQty} ${i.unit || 'ชิ้น'}
                </td>
                <td class="py-2.5 px-3 text-slate-500">
                  ${i.adjustNote ? `<span class="text-amber-700 font-semibold">⚠️ ${i.adjustNote}</span>` : '-'}
                </td>
              </tr>
            `;
          }).join("");

          const card = document.createElement("div");
          card.className = `bg-white p-6 rounded-2xl border ${isPartial ? 'border-amber-200' : 'border-slate-200'} shadow-sm space-y-3`;
          
          card.innerHTML = `
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
              <div>
                ${statusBadge}
                <span class="text-xs text-slate-400 ml-2">วันที่ขอเบิก: ${dateStr}</span>
                <p class="text-sm font-bold text-slate-800 mt-1">ผู้ขอเบิก: ${req.userName || 'ไม่ระบุชื่อ'}</p>
              </div>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead class="bg-slate-50 text-slate-500 font-bold uppercase border-b border-slate-200">
                  <tr>
                    <th class="py-2 px-3">SKU / รายการ</th>
                    <th class="py-2 px-3 text-center w-24">จำนวนที่ขอ</th>
                    <th class="py-2 px-3 text-center w-24">จำนวนที่ได้</th>
                    <th class="py-2 px-3">เหตุผล / หมายเหตุปรับลด</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">${itemsRows}</tbody>
              </table>
            </div>

            ${req.note ? `<p class="text-xs text-slate-500 bg-slate-50 p-2.5 rounded-xl border border-slate-100">💬 <span class="font-bold">หมายเหตุผู้ขอเบิก:</span> ${req.note}</p>` : ''}
            ${req.status === "rejected" ? `<p class="text-xs text-rose-600 bg-rose-50 p-2.5 rounded-xl border border-rose-100">❌ <span class="font-bold">เหตุผลที่ไม่อนุมัติ:</span> ${req.rejectReason || 'ไม่ระบุเหตุผล'}</p>` : ''}
          `;

          container.appendChild(card);
        });

      } catch (err) {
        container.innerHTML = `<div class="bg-rose-50 p-6 rounded-2xl text-center text-rose-600 text-xs font-bold">เกิดข้อผิดพลาดในการดึงข้อมูล: ${err.message}</div>`;
      }
    }

    loadHistory();
  </script>
</body>
</html>
