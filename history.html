<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockMaster - ประวัติการเบิกสินค้า</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Navbar -->
  <nav class="bg-slate-900 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-6">
        <span class="text-2xl font-bold text-blue-400">📦 StockMaster</span>
        <div class="hidden md:flex space-x-4 text-sm">
          <a href="requisition.html" class="hover:text-blue-300 py-1">ขอเบิกสินค้า</a>
          <a href="history.html" class="text-blue-400 border-b-2 border-blue-400 font-semibold py-1">ประวัติการเบิก</a>
          <a href="approvals.html" class="hover:text-blue-300 py-1 admin-only">รายการรออนุมัติ</a>
          <a href="admin-dashboard.html" class="hover:text-blue-300 py-1 admin-only">จัดการสต็อก</a>
          <a href="admin-users.html" class="hover:text-blue-300 py-1 admin-only">จัดการผู้ใช้</a>
        </div>
      </div>
      <div class="flex items-center space-x-4">
        <span id="userDisplayName" class="text-sm text-slate-300"></span>
        <button id="btnLogout" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-sm transition">
          ออกจากระบบ
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow">
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-slate-800">ประวัติการขอเบิกสินค้า</h1>
      <p class="text-slate-500 text-sm">ตรวจสอบสถานะรายการคำขอเบิกสินค้าย้อนหลัง</p>
    </div>

    <div class="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-800 text-slate-200 text-sm">
              <th class="p-4">เลขที่คำขอ</th>
              <th class="p-4">ผู้ขอเบิก</th>
              <th class="p-4">วันที่ทำรายการ</th>
              <th class="p-4">วัตถุประสงค์</th>
              <th class="p-4">จำนวนรายการ</th>
              <th class="p-4">สถานะ</th>
            </tr>
          </thead>
          <tbody id="historyTableBody" class="divide-y divide-slate-100 text-sm">
            <tr>
              <td colspan="6" class="p-8 text-center text-slate-400">กำลังโหลดประวัติข้อมูล...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script type="module">
    import { db, auth } from "./js/firebase-config.js";
    import { checkUserAuth } from "./js/auth.js";
    import { collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    checkUserAuth(['admin', 'user']);

    async function loadHistory() {
      const tableBody = document.getElementById("historyTableBody");
      try {
        const user = auth.currentUser;
        if (!user) return;

        const userDoc = await getDoc(doc(db, "users", user.uid));
        const isAdmin = userDoc.exists() && userDoc.data().role === "admin";

        // ถ้าเป็น Admin ดึงหมด ถ้าเป็น User ดึงเฉพาะตัวเอง
        let q = isAdmin 
          ? collection(db, "requisition_requests")
          : query(collection(db, "requisition_requests"), where("user_id", "==", user.uid));

        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          tableBody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-400">ยังไม่มีประวัติการทำรายการ</td></tr>`;
          return;
        }

        let html = "";
        querySnapshot.forEach(docSnap => {
          const item = docSnap.data();
          const reqId = docSnap.id;
          const dateStr = item.createdAt ? new Date(item.createdAt.toDate()).toLocaleString('th-TH') : '-';
          
          let statusBadge = `<span class="px-2.5 py-1 bg-amber-100 text-amber-800 rounded-full text-xs font-semibold">รอการตรวจสอบ</span>`;
          if (item.status === "approved") {
            statusBadge = `<span class="px-2.5 py-1 bg-emerald-100 text-emerald-800 rounded-full text-xs font-semibold">อนุมัติเรียบร้อย</span>`;
          } else if (item.status === "rejected") {
            statusBadge = `<span class="px-2.5 py-1 bg-red-100 text-red-800 rounded-full text-xs font-semibold">ถูกปฏิเสธ</span>`;
          }

          html += `
            <tr class="hover:bg-slate-50 transition border-b border-slate-100">
              <td class="p-4 font-mono font-medium text-slate-700">${reqId}</td>
              <td class="p-4 font-medium text-slate-800">${item.user_name || '-'}</td>
              <td class="p-4 text-slate-500 text-xs">${dateStr}</td>
              <td class="p-4 text-slate-600 max-w-xs truncate">${item.purpose || '-'}</td>
              <td class="p-4 text-slate-700">${item.items ? item.items.length : 0} รายการ</td>
              <td class="p-4">${statusBadge}</td>
            </tr>
          `;
        });

        tableBody.innerHTML = html;

      } catch (err) {
        console.error("Error loading history:", err);
        tableBody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-red-500">เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>`;
      }
    }

    setTimeout(loadHistory, 500);
  </script>
</body>
</html>
