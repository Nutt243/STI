<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockMaster - ส่งคำขอเบิกสินค้า</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Navbar -->
  <nav class="bg-slate-900 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-6">
        <span class="text-2xl font-bold text-blue-400">📦 StockMaster</span>
        <div class="hidden md:flex space-x-4 text-sm">
          <a href="requisition.html" class="text-blue-400 border-b-2 border-blue-400 font-semibold py-1">ขอเบิกสินค้า</a>
          <a href="history.html" class="hover:text-blue-300 py-1">ประวัติการเบิก</a>
          <a href="approvals.html" class="hover:text-blue-300 py-1 admin-only">รายการรออนุมัติ</a>
          <a href="admin-dashboard.html" class="hover:text-blue-300 py-1 admin-only">จัดการสต็อก</a>
          <a href="admin-users.html" class="hover:text-blue-300 py-1 admin-only">จัดการผู้ใช้</a>
        </div>
      </div>
      <div class="flex items-center space-x-4">
        <span id="userDisplayName" class="text-sm text-slate-300"></span>
        <button id="btnLogout" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-sm transition">
          ออกจากระบบ
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Left: Stock Items Catalogue -->
      <div class="lg:col-span-2 space-y-4">
        <div class="flex justify-between items-center">
          <h1 class="text-2xl font-bold text-slate-800">รายการสินค้าในคลัง</h1>
          <input type="text" id="searchInput" placeholder="🔍 ค้นหาชื่อสินค้า หรือ SKU..."
            class="px-4 py-2 border border-slate-300 rounded-lg text-sm w-64 focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div id="skuGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="col-span-full text-center py-8 text-slate-400">กำลังโหลดรายการสินค้า...</div>
        </div>
      </div>

      <!-- Right: Cart & Submit Request Form -->
      <div class="bg-white rounded-xl shadow-md border border-slate-200 p-6 flex flex-col justify-between h-fit">
        <div>
          <h2 class="text-lg font-bold text-slate-800 border-b border-slate-200 pb-3 mb-4 flex justify-between items-center">
            <span>🛒 รายการขอเบิก</span>
            <span id="cartCount" class="text-xs bg-blue-100 text-blue-700 px-2.5 py-0.5 rounded-full font-semibold">0 รายการ</span>
          </h2>

          <div id="cartItems" class="space-y-3 max-h-[350px] overflow-y-auto mb-4 pr-1">
            <p class="text-center text-slate-400 text-sm py-6">ยังไม่มีสินค้าในตะกร้า</p>
          </div>

          <div class="space-y-3 pt-3 border-t border-slate-200">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">วัตถุประสงค์ในการเบิก / หมายเหตุ</label>
              <textarea id="purposeInput" rows="2" placeholder="ระบุวัตถุประสงค์ เช่น นำไปใช้วิเคราะห์หลักฐานคดี..."
                class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
            </div>
          </div>
        </div>

        <button id="btnSubmitRequisition" disabled
          class="w-full mt-6 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-medium py-2.5 rounded-lg transition shadow">
          ส่งคำขอเบิกสินค้า
        </button>
      </div>

    </div>
  </main>

  <script type="module">
    import { db, auth } from "./js/firebase-config.js";
    import { checkUserAuth } from "./js/auth.js";
    import { collection, getDocs, addDoc, Timestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    checkUserAuth(['admin', 'user']);

    let allSKUs = [];
    let cart = [];

    const skuGrid = document.getElementById("skuGrid");
    const cartItemsContainer = document.getElementById("cartItems");
    const cartCount = document.getElementById("cartCount");
    const btnSubmit = document.getElementById("btnSubmitRequisition");

    // Load SKUs
    async function loadSKUs() {
      try {
        const querySnapshot = await getDocs(collection(db, "skus"));
        allSKUs = [];
        querySnapshot.forEach(docSnap => {
          allSKUs.push({ id: docSnap.id, ...docSnap.data() });
        });
        renderSKUs(allSKUs);
      } catch (err) {
        skuGrid.innerHTML = `<div class="col-span-full text-center text-red-500 py-8">โหลดสินค้าล้มเหลว: ${err.message}</div>`;
      }
    }

    function renderSKUs(skus) {
      if (skus.length === 0) {
        skuGrid.innerHTML = `<div class="col-span-full text-center text-slate-400 py-8">ไม่พบสินค้าในระบบ</div>`;
        return;
      }

      skuGrid.innerHTML = skus.map(sku => `
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between hover:border-blue-300 transition">
          <div>
            <div class="flex justify-between items-start">
              <span class="text-xs font-mono bg-slate-100 text-slate-600 px-2 py-0.5 rounded">${sku.id}</span>
              <span class="text-xs font-semibold ${sku.total_quantity > (sku.min_stock_alert || 0) ? 'text-emerald-600' : 'text-red-600'}">
                คงเหลือ: ${sku.total_quantity || 0} ${sku.unit || 'ชิ้น'}
              </span>
            </div>
            <h3 class="font-bold text-slate-800 mt-2 text-base">${sku.sku_name || 'ไม่ระบุชื่อ'}</h3>
            <p class="text-xs text-slate-500 mt-1">หมวดหมู่: ${sku.category || '-'}</p>
          </div>
          <button onclick="addToCart('${sku.id}')" ${sku.total_quantity <= 0 ? 'disabled' : ''}
            class="mt-4 w-full bg-slate-800 hover:bg-slate-900 disabled:bg-slate-200 disabled:text-slate-400 text-white text-xs py-2 rounded-lg font-medium transition">
            ${sku.total_quantity > 0 ? '+ เพิ่มในคำขอ' : 'สินค้าหมด'}
          </button>
        </div>
      `).join('');
    }

    window.addToCart = (skuId) => {
      const sku = allSKUs.find(s => s.id === skuId);
      if (!sku) return;

      const existing = cart.find(item => item.sku_id === skuId);
      if (existing) {
        if (existing.amount < sku.total_quantity) {
          existing.amount += 1;
        } else {
          alert("ไม่สามารถเพิ่มจำนวนเกินสินค้าคงเหลือในคลังได้");
        }
      } else {
        cart.push({
          sku_id: sku.id,
          sku_name: sku.sku_name,
          barcode: sku.barcode || '',
          amount: 1,
          max_amount: sku.total_quantity
        });
      }
      renderCart();
    };

    function renderCart() {
      cartCount.textContent = `${cart.length} รายการ`;
      btnSubmit.disabled = cart.length === 0;

      if (cart.length === 0) {
        cartItemsContainer.innerHTML = `<p class="text-center text-slate-400 text-sm py-6">ยังไม่มีสินค้าในตะกร้า</p>`;
        return;
      }

      cartItemsContainer.innerHTML = cart.map((item, index) => `
        <div class="flex justify-between items-center p-3 bg-slate-50 rounded-lg border border-slate-200">
          <div class="flex-grow pr-2">
            <div class="font-medium text-slate-800 text-sm">${item.sku_name}</div>
            <div class="text-xs text-slate-400 font-mono">${item.sku_id}</div>
          </div>
          <div class="flex items-center space-x-2">
            <input type="number" min="1" max="${item.max_amount}" value="${item.amount}"
              onchange="updateCartAmount(${index}, this.value)"
              class="w-14 px-2 py-1 border border-slate-300 rounded text-center text-sm font-semibold">
            <button onclick="removeFromCart(${index})" class="text-red-500 hover:text-red-700 text-sm font-bold px-1">&times;</button>
          </div>
        </div>
      `).join('');
    }

    window.updateCartAmount = (index, val) => {
      const num = parseInt(val);
      if (num > cart[index].max_amount) {
        alert("จำนวนเกินสินค้าคงเหลือ");
        cart[index].amount = cart[index].max_amount;
      } else if (num > 0) {
        cart[index].amount = num;
      }
      renderCart();
    };

    window.removeFromCart = (index) => {
      cart.splice(index, 1);
      renderCart();
    };

    // Filter Search
    document.getElementById("searchInput").addEventListener("input", (e) => {
      const kw = e.target.value.toLowerCase().trim();
      const filtered = allSKUs.filter(s => 
        s.sku_name.toLowerCase().includes(kw) || s.id.toLowerCase().includes(kw)
      );
      renderSKUs(filtered);
    });

    // Submit Request
    btnSubmit.addEventListener("click", async () => {
      const purpose = document.getElementById("purposeInput").value.trim();
      const currentUser = auth.currentUser;

      if (cart.length === 0) return;

      btnSubmit.disabled = true;
      btnSubmit.textContent = "กำลังส่งคำขอ...";

      try {
        await addDoc(collection(db, "requisition_requests"), {
          user_id: currentUser.uid,
          user_name: currentUser.displayName || currentUser.email,
          purpose: purpose,
          status: "pending",
          items: cart,
          createdAt: Timestamp.now()
        });

        alert("ส่งคำขอเบิกสินค้าเรียบร้อยแล้ว!");
        cart = [];
        document.getElementById("purposeInput").value = "";
        renderCart();

      } catch (err) {
        alert("เกิดข้อผิดพลาด: " + err.message);
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = "ส่งคำขอเบิกสินค้า";
      }
    });

    loadSKUs();
  </script>
</body>
</html>
