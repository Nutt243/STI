<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockMaster - เบิกจ่ายสินค้า</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
            darkbg: '#0f172a', darkcard: '#1e293b', darkinput: '#334155'
          }
        }
      }
    }
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-darkbg text-slate-100 min-h-screen pb-20">
  <!-- 🟢 Navbar พร้อมปุ่ม Logout เล็กมุมขวาบน -->
  <nav class="bg-slate-800 text-white px-4 py-3 flex items-center justify-between shadow-md">
    
    <!-- ฝั่งซ้าย: โลโก้ + เมนูทั่วไป และ เมนู Admin -->
    <div class="flex items-center gap-4">
      <h1 class="font-bold text-lg text-blue-400">POS System</h1>
      <a href="index.html" class="text-sm hover:text-blue-300 font-medium">เบิกสินค้า / คัดแยก</a>
      
      <!-- เมนูพิเศษเฉพาะ Admin (ซ่อนไว้ก่อน) -->
      <a href="dashboard.html" class="admin-only hidden text-sm text-amber-400 hover:underline">📊 Dashboard</a>
      <a href="approvals.html" class="admin-only hidden text-sm text-green-400 hover:underline">✅ อนุมัติคำขอ</a>
    </div>

    <!-- 🚪 ฝั่งขวา: ปุ่ม Logout ขนาดเล็กมุมขวาบน -->
    <div class="flex items-center">
      <button onclick="handleLogout()" 
              title="ออกจากระบบ" 
              class="text-xs bg-red-600/80 hover:bg-red-600 text-white px-2.5 py-1 rounded transition flex items-center gap-1">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        <span>ออกระบบ</span>
      </button>
    </div>

  </nav>
  <!-- Top Navigation -->
  <header class="bg-darkcard border-b border-slate-700/60 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-brand-600/20 border border-brand-500/30 text-brand-500 rounded-xl flex items-center justify-center font-bold">
          <i class="fa-solid fa-boxes-stacked"></i>
        </div>
        <div>
          <h1 class="font-bold text-white leading-none">StockMaster</h1>
          <span class="text-xs text-slate-400">ระบบรายการเบิกพัสดุ</span>
        </div>
      </div>
      
      <div class="flex items-center gap-4">
        <a href="history.html" class="text-xs font-semibold px-3 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-lg transition text-slate-300 flex items-center gap-2">
          <i class="fa-solid fa-clock-rotate-left"></i>
          <span>ประวัติการเบิก</span>
        </a>
        <div id="userInfo" class="text-xs text-slate-400 border-l border-slate-700 pl-4 hidden md:block">
          <!-- Loaded dynamically -->
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-xl font-bold text-white flex items-center gap-2">
        <i class="fa-solid fa-layer-group text-brand-500"></i> หมวดหมู่สินค้าทั้งหมด (SKU)
      </h2>
      <input type="text" id="searchInput" placeholder="ค้นหาชื่อสินค้า..." class="bg-darkcard border border-slate-700 rounded-xl px-4 py-2 text-sm w-64 focus:outline-none focus:border-brand-500 text-white">
    </div>

    <!-- Product Grid -->
    <div id="productGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- Loading Skeleton / Render items -->
    </div>
  </main>

  <!-- Cart Floating Drawer Button -->
  <div id="cartBar" class="fixed bottom-4 left-1/2 -translate-x-1/2 w-full max-w-xl px-4 z-40 hidden">
    <div class="bg-brand-600 text-white p-4 rounded-2xl shadow-2xl flex items-center justify-between border border-brand-400/30">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center font-bold text-lg">
          <i class="fa-solid fa-cart-shopping"></i>
        </div>
        <div>
          <div class="text-xs text-brand-200">รายการที่เลือกเบิก</div>
          <div id="cartCountText" class="font-bold text-sm">0 รายการ</div>
        </div>
      </div>
      <button onclick="toggleCartDrawer(true)" class="bg-white text-brand-700 hover:bg-brand-50 px-5 py-2.5 rounded-xl font-bold text-sm transition shadow-md flex items-center gap-2">
        <span>ดูตะกร้าเบิก</span>
        <i class="fa-solid fa-chevron-right text-xs"></i>
      </button>
    </div>
  </div>

  <!-- Cart Modal / Drawer -->
  <div id="cartDrawer" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex justify-end hidden">
    <div class="w-full max-w-md bg-darkcard h-full p-6 flex flex-col justify-between border-l border-slate-700">
      <div>
        <div class="flex justify-between items-center pb-4 border-b border-slate-700 mb-4">
          <h3 class="text-lg font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-cart-flatbed text-brand-500"></i> ตะกร้าสินค้า
          </h3>
          <button onclick="toggleCartDrawer(false)" class="text-slate-400 hover:text-white p-2">
            <i class="fa-solid fa-xmark text-xl"></i>
          </button>
        </div>

        <div id="cartItemsList" class="space-y-3 overflow-y-auto max-h-[calc(100vh-220px)] pr-1">
          <!-- Cart items render here -->
        </div>
      </div>

      <div class="border-t border-slate-700 pt-4 space-y-3">
        <button onclick="submitRequisition()" class="w-full py-3 bg-brand-600 hover:bg-brand-500 text-white font-bold rounded-xl transition shadow-lg shadow-brand-600/30 flex items-center justify-center gap-2">
          <i class="fa-solid fa-paper-plane"></i>
          <span>ยืนยันส่งคำขอเบิก</span>
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import { db, collection, getDocs, addDoc, serverTimestamp } from './firebase-config.js';

    // Mock Data สำหรับทดสอบเมื่อยังไม่ได้เชื่อม Database จริง
    const mockSkus = [
      { id: 'sku_01', sku_name: 'Harddisk Internal 2TB', category: 'IT Hardware', total_quantity: 15, unit: 'ลูก', variant_attributes: { interface: 'SATA3', form_factor: '3.5 inch' } },
      { id: 'sku_02', sku_name: 'หมึกพิมพ์ Epson 003 Black', category: 'Supplies', total_quantity: 8, unit: 'ขวด', variant_attributes: { color: 'Black', volume: '65ml' } },
      { id: 'sku_03', sku_name: 'ปากกาลูกลื่น 0.5mm สีดำ', category: 'Office', total_quantity: 120, unit: 'ด้าม', variant_attributes: { color: 'Black', ink: 'Gel' } }
    ];

    let cart = {}; // { sku_id: { sku, amount } }
    const user = JSON.parse(localStorage.getItem('stockmaster_user') || '{"name":"User Demo","uid":"demo_uid"}');

    document.getElementById('userInfo').innerText = `${user.name} (${user.role || 'user'})`;

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = mockSkus.map(sku => `
        <div class="bg-darkcard border border-slate-700/60 rounded-2xl p-5 hover:border-slate-600 transition flex flex-col justify-between">
          <div>
            <div class="flex justify-between items-start mb-2">
              <span class="text-[10px] font-semibold tracking-wider uppercase px-2.5 py-1 bg-brand-500/10 text-brand-400 border border-brand-500/20 rounded-md">
                ${sku.category}
              </span>
              <span class="text-xs text-slate-400">คงเหลือ: <strong class="text-white">${sku.total_quantity}</strong> ${sku.unit}</span>
            </div>
            <h3 class="font-bold text-white text-base mb-2">${sku.sku_name}</h3>
            
            <div class="flex flex-wrap gap-1.5 mb-4">
              ${Object.entries(sku.variant_attributes || {}).map(([k, v]) => `
                <span class="text-[11px] bg-slate-800 text-slate-300 border border-slate-700 px-2 py-0.5 rounded-md">
                  ${k}:${v}
                </span>
              `).join('')}
            </div>
          </div>

          <div class="flex items-center justify-between border-t border-slate-700/50 pt-3 mt-2">
            <span class="text-xs text-slate-400">ระบุจำนวนเบิก</span>
            <div class="flex items-center gap-2">
              <button onclick="updateCart('${sku.id}', -1)" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-white flex items-center justify-center font-bold border border-slate-600 transition">-</button>
              <span id="qty-${sku.id}" class="w-8 text-center font-bold text-sm text-white">${cart[sku.id]?.amount || 0}</span>
              <button onclick="updateCart('${sku.id}', 1)" class="w-8 h-8 rounded-lg bg-brand-600 hover:bg-brand-500 text-white flex items-center justify-center font-bold transition">+</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    window.updateCart = (skuId, change) => {
      const sku = mockSkus.find(s => s.id === skuId);
      if (!sku) return;

      if (!cart[skuId]) cart[skuId] = { sku, amount: 0 };
      cart[skuId].amount += change;

      if (cart[skuId].amount <= 0) {
        delete cart[skuId];
      } else if (cart[skuId].amount > sku.total_quantity) {
        cart[skuId].amount = sku.total_quantity;
        alert('จำนวนที่เลือกเกินสต็อกคงเหลือรวม');
      }

      document.getElementById(`qty-${skuId}`).innerText = cart[skuId]?.amount || 0;
      updateCartBar();
    };

    function updateCartBar() {
      const totalItems = Object.values(cart).reduce((a, c) => a + c.amount, 0);
      const bar = document.getElementById('cartBar');
      if (totalItems > 0) {
        bar.classList.remove('hidden');
        document.getElementById('cartCountText').innerText = `${totalItems} รายการสินค้า`;
      } else {
        bar.classList.add('hidden');
      }
      renderCartItems();
    }

    function renderCartItems() {
      const container = document.getElementById('cartItemsList');
      if (Object.keys(cart).length === 0) {
        container.innerHTML = '<div class="text-center text-slate-500 py-10">ยังไม่มีสินค้าในตะกร้า</div>';
        return;
      }

      container.innerHTML = Object.values(cart).map(({ sku, amount }) => `
        <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700 flex justify-between items-center">
          <div>
            <div class="font-bold text-sm text-white">${sku.sku_name}</div>
            <div class="text-xs text-slate-400">${amount} ${sku.unit}</div>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="updateCart('${sku.id}', -1)" class="w-6 h-6 rounded bg-slate-700 text-white text-xs">-</button>
            <span class="text-sm font-bold w-4 text-center">${amount}</span>
            <button onclick="updateCart('${sku.id}', 1)" class="w-6 h-6 rounded bg-brand-600 text-white text-xs">+</button>
          </div>
        </div>
      `).join('');
    }

    window.toggleCartDrawer = (show) => {
      document.getElementById('cartDrawer').classList.toggle('hidden', !show);
    };

    window.submitRequisition = async () => {
      if (Object.keys(cart).length === 0) return;

      const items = Object.values(cart).map(({ sku, amount }) => ({
        sku_id: sku.id,
        sku_name: sku.sku_name,
        amount: amount
      }));

      try {
        // บันทึกลง Firestore collection 'requisition_requests'
        await addDoc(collection(db, 'requisition_requests'), {
          user_id: user.uid,
          user_name: user.name,
          items: items,
          status: 'pending',
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        });

        alert('ส่งคำขอเบิกสินค้าเรียบร้อยแล้ว!');
        window.location.href = 'history.html';
      } catch (e) {
        console.warn('Firestore offline, Redirecting via Local Storage Mock');
        window.location.href = 'history.html';
      }
    };

    renderProducts();
  </script>
  <script type="module">
  // 1. Import ฟังก์ชันจาก auth.js (เช็ก Path โฟลเดอร์ให้ถูกต้อง เช่น ./js/auth.js)
  import { handleLogout, checkUserRole } from './js/auth.js';

  // 2. ผูกปุ่ม Logout
  const btnLogout = document.getElementById('btnLogout');
  if (btnLogout) {
    btnLogout.addEventListener('click', handleLogout);
  }

  // 3. ตรวจสอบสิทธิ์ผู้ใช้ (ทำงานอัตโนมัติเมื่อโหลดหน้าเว็บ)
  // หากต้องการทำอะไรเพิ่มเติมหลังจากรู้สิทธิ์ผู้ใช้ สามารถใส่ Callback function เพิ่มได้ เช่น:
  checkUserRole((user, role) => {
    console.log(`User ID: ${user.uid}, Role: ${role}`);
    // สามารถเขียนโค้ดโหลดข้อมูลตาม role ต่อตรงนี้ได้
  });
</script>
</body>
</html>
