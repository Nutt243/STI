<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockMaster - จัดการสต็อกสินค้า</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Navbar -->
  <nav class="bg-slate-900 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-6">
        <span class="text-2xl font-bold text-blue-400">📦 StockMaster</span>
        <div class="hidden md:flex space-x-4 text-sm">
          <a href="requisition.html" class="hover:text-blue-300 py-1">ขอเบิกสินค้า</a>
          <a href="history.html" class="hover:text-blue-300 py-1">ประวัติการเบิก</a>
          <a href="approvals.html" class="hover:text-blue-300 py-1 admin-only">รายการรออนุมัติ</a>
          <a href="admin-dashboard.html" class="text-blue-400 border-b-2 border-blue-400 font-semibold py-1 admin-only">จัดการสต็อก</a>
          <a href="admin-users.html" class="hover:text-blue-300 py-1 admin-only">จัดการผู้ใช้</a>
        </div>
      </div>
      <div class="flex items-center space-x-4">
        <span id="userDisplayName" class="text-sm text-slate-300"></span>
        <button id="btnLogout" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-sm transition">
          ออกจากระบบ
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow">
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">จัดการสต็อกและรายการสินค้า (SKU)</h1>
        <p class="text-slate-500 text-sm">เพิ่ม ปรับยอด หรือตั้งค่าการแจ้งเตือนสต็อกขั้นต่ำ</p>
      </div>
      <button onclick="openAddModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow">
        + เพิ่ม SKU สินค้าใหม่
      </button>
    </div>

    <div class="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-slate-800 text-slate-200 text-sm">
            <th class="p-4">SKU ID</th>
            <th class="p-4">ชื่อสินค้า</th>
            <th class="p-4">หมวดหมู่</th>
            <th class="p-4">สต็อกคงเหลือ</th>
            <th class="p-4">แจ้งเตือนขั้นต่ำ</th>
            <th class="p-4 text-center">จัดการ</th>
          </tr>
        </thead>
        <tbody id="skuTableBody" class="divide-y divide-slate-100 text-sm">
          <tr><td colspan="6" class="p-8 text-center text-slate-400">กำลังโหลดข้อมูลสต็อก...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import { checkUserAuth } from "./js/auth.js";
    import { collection, getDocs, setDoc, doc, Timestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    checkUserAuth(['admin']);

    async function loadStockData() {
      const tableBody = document.getElementById("skuTableBody");
      try {
        const querySnapshot = await getDocs(collection(db, "skus"));
        if (querySnapshot.empty) {
          tableBody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-400">ไม่มีข้อมูล SKU สินค้า</td></tr>`;
          return;
        }

        let html = "";
        querySnapshot.forEach(docSnap => {
          const sku = docSnap.data();
          const isLow = (sku.total_quantity || 0) <= (sku.min_stock_alert || 0);

          html += `
            <tr class="hover:bg-slate-50 border-b border-slate-100">
              <td class="p-4 font-mono font-medium text-slate-700">${docSnap.id}</td>
              <td class="p-4 font-bold text-slate-800">${sku.sku_name || '-'}</td>
              <td class="p-4 text-slate-500">${sku.category || '-'}</td>
              <td class="p-4 font-semibold ${isLow ? 'text-red-600' : 'text-emerald-600'}">
                ${sku.total_quantity || 0} ${sku.unit || 'ชิ้น'}
              </td>
              <td class="p-4 text-slate-500">${sku.min_stock_alert || 0} ${sku.unit || 'ชิ้น'}</td>
              <td class="p-4 text-center">
                <button onclick="editSku('${docSnap.id}')" class="text-blue-600 hover:text-blue-800 text-xs font-semibold mr-2">แก้ไข</button>
              </td>
            </tr>
          `;
        });
        tableBody.innerHTML = html;

      } catch (err) {
        tableBody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-red-500">เกิดข้อผิดพลาด: ${err.message}</td></tr>`;
      }
    }

    window.openAddModal = async () => {
      const skuId = prompt("กรอก รหัส SKU (เช่น SKU-001):");
      if (!skuId) return;
      const skuName = prompt("กรอก ชื่อสินค้า:");
      const qty = parseInt(prompt("กรอก จำนวนสต็อกตั้งต้น:", "0"));

      if (skuId && skuName) {
        await setDoc(doc(db, "skus", skuId), {
          sku_name: skuName,
          total_quantity: qty || 0,
          unit: "ชิ้น",
          category: "ทั่วไป",
          min_stock_alert: 5,
          updatedAt: Timestamp.now()
        });
        alert("เพิ่ม SKU สำเร็จ");
        loadStockData();
      }
    };

    loadStockData();
  </script>
</body>
</html>
