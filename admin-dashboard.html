  <!-- 🔵 ส่วนเนื้อหาด้านล่าง (Sidebar + Main Content) -->
  <div class="flex flex-1 min-h-0">

    <!-- Sidebar -->
<!-- Sidebar -->
<aside class="w-64 bg-darkcard border-r border-slate-800 flex flex-col justify-between hidden md:flex shrink-0">

    <nav class="space-y-1">

      </a>

      <!-- 🟢 เพิ่มเมนู "อนุมัติคำขอ" พร้อม Badge ตัวเลข -->

      <a href="admin-unregistered.html" class="flex items-center justify-between px-3 py-2.5 text-slate-400 hover:bg-slate-800 rounded-xl text-sm font-semibold transition">

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
      <!-- Header Controls -->
      <header class="bg-darkcard border-b border-slate-800 px-6 py-4 flex flex-wrap justify-between items-center gap-4">
        <h1 class="text-xl font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-table-list text-brand-500"></i> คลังพัสดุแบบจัดกลุ่ม (Expandable Sheet View)
        </h1>

        <div class="flex flex-wrap gap-2">
          <button class="bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold px-4 py-2 rounded-xl transition flex items-center gap-1.5 shadow-md">
            <i class="fa-solid fa-plus"></i> เพิ่มหมวดหมู่ (SKU)
          </button>
          <button class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-semibold px-4 py-2 rounded-xl transition flex items-center gap-1.5">
            <i class="fa-solid fa-folder-plus"></i> เพิ่มยี่ห้อ/สินค้าย่อย
          </button>
          <a href="admin-unregistered.html" class="bg-amber-600/20 hover:bg-amber-600/30 text-amber-300 border border-amber-500/30 text-xs font-semibold px-4 py-2 rounded-xl transition flex items-center gap-1.5">
            <i class="fa-solid fa-qrcode"></i> สแกนรับสินค้า
          </a>
        </div>
      </header>

      <!-- Spreadsheet Table Area -->
      <main class="p-6 overflow-x-auto">
        <div class="bg-darkcard border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
          <table class="w-full text-left text-sm text-slate-300">
            <thead class="bg-slate-900/80 text-xs uppercase tracking-wider text-slate-400 border-b border-slate-800">
              <tr>
                <th class="py-3.5 px-4 w-10"></th>
                <th class="py-3.5 px-4">ชื่อ SKU / รายการหลัก</th>
                <th class="py-3.5 px-4">หมวดหมู่</th>
                <th class="py-3.5 px-4 text-center">คงเหลือรวม</th>
                <th class="py-3.5 px-4">หน่วย</th>
                <th class="py-3.5 px-4">การแจ้งเตือน</th>
                <th class="py-3.5 px-4 text-right">จัดการ</th>
              </tr>
            </thead>
            <tbody id="sheetTbody" class="divide-y divide-slate-800/60 font-mono text-xs">
              <!-- Dynamic Sheet Rows -->
            </tbody>
          </table>
        </div>
      </main>
    </div>

  </div>

<script type="module">
  // 1. Import ฟังก์ชัน Firestore ที่จำเป็น (เพิ่ม query และ where เข้ามาด้วย)
  import { db, handleLogout } from './js/auth.js';
  import { 
    collection, 
    query, 
    where, 
    getDocs, 
    onSnapshot,
    runTransaction, 
    doc 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // 2. ดึงนับจำนวน pending มาใส่ Badge แบบ Realtime
  const pendingQuery = query(collection(db, 'requisition_requests'), where('status', '==', 'pending'));
  onSnapshot(pendingQuery, (snapshot) => {
    const badge = document.getElementById('pendingApprovalsBadge');
    if (badge) {
      badge.innerText = snapshot.size; // อัปเดตตัวเลขเป็นจำนวนคำขอที่รออนุมัติจริง
    }
  }, (error) => {
    console.error("Error fetching pending requests:", error);
  });

  // ผูก Event Click ของปุ่ม Logout
  const btnLogout = document.getElementById('btnLogout');
  if (btnLogout) {
    btnLogout.addEventListener('click', handleLogout);
  }

  // ตัวแปรเก็บข้อมูลสต็อกจริงจาก Firebase
  let inventoryData = [];
  let expandedRows = new Set();

  // 2. ดึงข้อมูล Realtime จาก Firestore (จับคู่ skus กับ products)
  function loadRealtimeData() {
    // ฟังการเปลี่ยนแปลงของ collection 'skus' แบบ Realtime
    onSnapshot(collection(db, 'skus'), async (skusSnapshot) => {
      // ดึงข้อมูลสินค้าทั้งหมดจาก collection 'products'
      const productsSnapshot = await getDocs(collection(db, 'products'));
      const allProducts = productsSnapshot.docs.map(doc => ({
        id: doc.id,
        ...doc.data()
      }));

      // นำ skus มาแมปกับ products ที่มี sku_id ตรงกัน
      inventoryData = skusSnapshot.docs.map(docSnap => {
        const skuData = docSnap.data();
        const skuId = skuData.sku_id || docSnap.id;

        // ดึงสินค้าย่อยที่อยู่ใน SKU นี้
        const relatedProducts = allProducts.filter(p => p.sku_id === skuId);

        return {
          id: docSnap.id,
          sku_id: skuId,
          sku_name: skuData.sku_name || 'ไม่ระบุชื่อ',
          category: skuData.category || 'ทั่วไป',
          total_quantity: skuData.total_quantity ?? 0,
          unit: skuData.unit || 'ชิ้น',
          min_stock_alert: skuData.min_stock_alert ?? 0,
          products: relatedProducts.map(p => ({
            product_id: p.product_id || p.id,
            brand: p.specific_attributes?.brand || 'ไม่ระบุยี่ห้อ',
            series: p.specific_attributes?.series || '-',
            code: p.code || '-',
            quantity: p.quantity ?? 0,
            storage_location: p.specific_attributes?.storage_location || 'ไม่ระบุตำแหน่ง'
          }))
        };
      });

      renderSheet();
    }, (error) => {
      console.error("Error fetching Firestore data:", error);
    });
  }

  // Toggle การพับ/ขยายแถว
  window.toggleExpand = (skuId) => {
    if (expandedRows.has(skuId)) {
      expandedRows.delete(skuId);
    } else {
      expandedRows.add(skuId);
    }
    renderSheet();
  };

  // 3. ฟังก์ชัน Render ตาราง
  function renderSheet() {
    const tbody = document.getElementById('sheetTbody');
    if (!tbody) return;

    if (inventoryData.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="7" class="py-8 text-center text-slate-500">
            ไม่พบข้อมูลพัสดุในระบบ
          </td>
        </tr>`;
      return;
    }

    let html = '';

    inventoryData.forEach(item => {
      const isExpanded = expandedRows.has(item.sku_id);
      const isLowStock = item.total_quantity <= item.min_stock_alert;

      html += `
        <tr class="hover:bg-slate-800/40 transition bg-slate-900/30 font-sans">
          <td class="py-3 px-4 text-center">
            <button onclick="toggleExpand('${item.sku_id}')" class="text-slate-400 hover:text-white p-1">
              <i class="fa-solid fa-chevron-${isExpanded ? 'down' : 'right'}"></i>
            </button>
          </td>
          <td class="py-3 px-4 font-bold text-white text-sm">${item.sku_name}</td>
          <td class="py-3 px-4"><span class="bg-slate-800 text-slate-300 px-2.5 py-1 rounded border border-slate-700">${item.category}</span></td>
          <td class="py-3 px-4 text-center font-bold text-sm ${isLowStock ? 'text-rose-400' : 'text-emerald-400'}">${item.total_quantity}</td>
          <td class="py-3 px-4 text-slate-400">${item.unit}</td>
          <td class="py-3 px-4">
            ${isLowStock ? '<span class="text-rose-400 bg-rose-500/10 px-2 py-0.5 rounded border border-rose-500/20 text-[10px]">⚠️ พัสดุเหลือน้อย</span>' : '<span class="text-slate-500">ปกติ</span>'}
          </td>
          <td class="py-3 px-4 text-right">
            <button class="text-brand-400 hover:text-brand-300 font-semibold text-xs">แก้ไข</button>
          </td>
        </tr>
      `;

      if (isExpanded) {
        if (item.products.length === 0) {
          html += `
            <tr class="bg-slate-950/60 text-slate-500 border-l-4 border-slate-700">
              <td></td>
              <td class="py-2.5 px-4 pl-8 text-xs" colspan="6">ยังไม่มีสินค้าย่อยในหมวดหมู่นี้</td>
            </tr>`;
        } else {
          item.products.forEach(p => {
            html += `
              <tr class="bg-slate-950/60 text-slate-400 border-l-4 border-brand-500">
                <td></td>
                <td class="py-2.5 px-4 pl-8" colspan="2">
                  <div class="flex items-center gap-2">
                    <i class="fa-solid fa-turn-up rotate-90 text-slate-600 text-xs"></i>
                    <strong class="text-slate-200">${p.brand}</strong> - ${p.series} 
                    <span class="text-slate-500">(${p.code})</span>
                  </div>
                </td>
                <td class="py-2.5 px-4 text-center font-bold text-slate-200">${p.quantity}</td>
                <td class="py-2.5 px-4 text-xs">${p.storage_location}</td>
                <td class="py-2.5 px-4" colspan="2">
                  <button onclick="approveDeductTransaction('${item.sku_id}', '${p.product_id}', 1)" class="bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/30 px-2 py-1 rounded text-[11px] font-sans transition">
                    ตัดสต็อก -1
                  </button>
                </td>
              </tr>
            `;
          });
        }
      }
    });

    tbody.innerHTML = html;
  }

  // 4. ฟังก์ชัน Atomic Transaction ตัดสต็อกลง Firestore จริง
  window.approveDeductTransaction = async (skuId, productId, amount) => {
    try {
      await runTransaction(db, async (transaction) => {
        const skuRef = doc(db, 'skus', skuId);
        const productRef = doc(db, 'products', productId);

        const skuDoc = await transaction.get(skuRef);
        const productDoc = await transaction.get(productRef);

        if (!skuDoc.exists() || !productDoc.exists()) {
          throw new Error("ไม่พบข้อมูลพัสดุในระบบ");
        }

        const newProductQty = productDoc.data().quantity - amount;
        const newTotalQty = skuDoc.data().total_quantity - amount;

        if (newProductQty < 0 || newTotalQty < 0) {
          throw new Error("จำนวนสินค้าในสต็อกไม่เพียงพอ");
        }

        transaction.update(productRef, { 
          quantity: newProductQty,
          updatedAt: new Date().toISOString()
        });
        
        transaction.update(skuRef, { 
          total_quantity: newTotalQty,
          updatedAt: new Date().toISOString()
        });
      });

      alert('ตัดสต็อกเรียบร้อยแล้ว');
    } catch (e) {
      console.error("Deduct error:", e);
      alert(`เกิดข้อผิดพลาด: ${e.message}`);
    }
  };

  // เริ่มโหลดข้อมูล realtime เมื่อหน้าเว็บโหลดเสร็จ
  loadRealtimeData();
</script>
</body>
