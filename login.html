<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockMaster Sheet - เข้าสู่ระบบ / สมัครสมาชิก</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
            darkbg: '#0f172a',
            darkcard: '#1e293b',
            darkinput: '#334155'
          }
        }
      }
    }
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-darkbg text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-darkcard rounded-2xl shadow-2xl p-8 border border-slate-700/50">
    <!-- Header -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-brand-600/20 text-brand-500 rounded-2xl mb-3 border border-brand-500/30">
        <i class="fa-solid fa-boxes-stacked text-3xl"></i>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">StockMaster Sheet</h1>
      <p class="text-xs text-slate-400 mt-1">ระบบบริหารจัดการคลังสินค้าและหมวดหมู่</p>
    </div>

    <!-- Toggle Auth Mode Tab -->
    <div class="mb-6 bg-slate-900/60 p-1.5 rounded-xl border border-slate-700/50 flex">
      <button id="tab-login" type="button" onclick="switchAuthMode('login')" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all duration-200 bg-brand-600 text-white shadow-md">
        <i class="fa-solid fa-right-to-bracket mr-1.5"></i> เข้าสู่ระบบ
      </button>
      <button id="tab-register" type="button" onclick="switchAuthMode('register')" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition-all duration-200">
        <i class="fa-solid fa-user-plus mr-1.5"></i> สมัครสมาชิก
      </button>
    </div>

    <!-- Alert Box -->
    <div id="alertBox" class="hidden mb-4 p-3 rounded-xl text-xs flex items-center gap-2"></div>

    <!-- Form เข้าสู่ระบบ -->
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1.5">อีเมล</label>
        <div class="relative">
          <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
          <input type="email" id="login-email" required placeholder="name@company.com" 
            class="w-full pl-10 pr-4 py-2.5 bg-darkinput border border-slate-600 rounded-xl text-sm focus:outline-none focus:border-brand-500 text-white placeholder-slate-400">
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1.5">รหัสผ่าน</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
          <input type="password" id="login-password" required placeholder="••••••••" 
            class="w-full pl-10 pr-4 py-2.5 bg-darkinput border border-slate-600 rounded-xl text-sm focus:outline-none focus:border-brand-500 text-white placeholder-slate-400">
        </div>
      </div>

      <button type="submit" 
        class="w-full py-3 bg-brand-600 hover:bg-brand-500 text-white font-semibold rounded-xl transition-all shadow-lg shadow-brand-600/30 flex items-center justify-center gap-2">
        <span>เข้าสู่ระบบ</span>
        <i class="fa-solid fa-arrow-right text-sm"></i>
      </button>
    </form>

    <!-- Form สมัครสมาชิก -->
    <form id="registerForm" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1.5">ชื่อ-นามสกุล</label>
        <div class="relative">
          <i class="fa-solid fa-user absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
          <input type="text" id="reg-name" required placeholder="สมชาย ใจดี" 
            class="w-full pl-10 pr-4 py-2.5 bg-darkinput border border-slate-600 rounded-xl text-sm focus:outline-none focus:border-brand-500 text-white placeholder-slate-400">
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1.5">อีเมล</label>
        <div class="relative">
          <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
          <input type="email" id="reg-email" required placeholder="name@company.com" 
            class="w-full pl-10 pr-4 py-2.5 bg-darkinput border border-slate-600 rounded-xl text-sm focus:outline-none focus:border-brand-500 text-white placeholder-slate-400">
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1.5">รหัสผ่าน</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
          <input type="password" id="reg-password" required placeholder="อย่างน้อย 6 หลัก" 
            class="w-full pl-10 pr-4 py-2.5 bg-darkinput border border-slate-600 rounded-xl text-sm focus:outline-none focus:border-brand-500 text-white placeholder-slate-400">
        </div>
      </div>

      <div class="p-3 bg-amber-500/10 border border-amber-500/20 rounded-xl text-[11px] text-amber-300">
        <i class="fa-solid fa-circle-info mr-1"></i> เมื่อลงทะเบียนแล้ว บัญชีจะต้องรอได้รับการอนุมัติจาก Admin ก่อนจึงจะสามารถเข้าใช้งานได้
      </div>

      <button type="submit" 
        class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl transition-all shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2">
        <span>ส่งคำขอลงทะเบียน</span>
        <i class="fa-solid fa-paper-plane text-sm"></i>
      </button>
    </form>
  </div>

  <script type="module">
    import { auth, db, doc, getDoc, setDoc, serverTimestamp } from './firebase-config.js';
    import { createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

    window.switchAuthMode = (mode) => {
      const loginTab = document.getElementById('tab-login');
      const regTab = document.getElementById('tab-register');
      const loginForm = document.getElementById('loginForm');
      const regForm = document.getElementById('registerForm');
      hideAlert();

      if (mode === 'login') {
        loginTab.className = 'flex-1 py-2 text-xs font-bold rounded-lg transition-all duration-200 bg-brand-600 text-white shadow-md';
        regTab.className = 'flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition-all duration-200';
        loginForm.classList.remove('hidden');
        regForm.classList.add('hidden');
      } else {
        regTab.className = 'flex-1 py-2 text-xs font-bold rounded-lg transition-all duration-200 bg-brand-600 text-white shadow-md';
        loginTab.className = 'flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition-all duration-200';
        regForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
      }
    };

    function showAlert(msg, type = 'error') {
      const box = document.getElementById('alertBox');
      box.classList.remove('hidden', 'bg-rose-500/10', 'text-rose-400', 'border-rose-500/30', 'bg-emerald-500/10', 'text-emerald-400', 'border-emerald-500/30', 'bg-amber-500/10', 'text-amber-300', 'border-amber-500/30');
      
      if (type === 'error') {
        box.classList.add('bg-rose-500/10', 'text-rose-400', 'border', 'border-rose-500/30');
      } else if (type === 'success') {
        box.classList.add('bg-emerald-500/10', 'text-emerald-400', 'border', 'border-emerald-500/30');
      } else {
        box.classList.add('bg-amber-500/10', 'text-amber-300', 'border', 'border-amber-500/30');
      }
      box.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> <span>${msg}</span>`;
    }

    function hideAlert() {
      document.getElementById('alertBox').classList.add('hidden');
    }

    // สมัครสมาชิก
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const uid = userCredential.user.uid;

        // บันทึกข้อมูลลง collection users พร้อมสถานะ pending_approval
        await setDoc(doc(db, 'users', uid), {
          uid: uid,
          name: name,
          email: email,
          role: 'user', // สิทธิ์เริ่มต้น
          status: 'pending_approval', // รอ Admin อนุมัติ
          createdAt: serverTimestamp()
        });

        showAlert('ลงทะเบียนสำเร็จ! กรุณารอ Admin ตรวจสอบและอนุมัติบัญชี', 'success');
        document.getElementById('registerForm').reset();
      } catch (err) {
        showAlert('ลงทะเบียนไม่สำเร็จ: ' + err.message, 'error');
      }
    });

    // เข้าสู่ระบบ
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const uid = userCredential.user.uid;

        // ตรวจสอบสิทธิ์และสถานะจาก Firestore
        const userDoc = await getDoc(doc(db, 'users', uid));
        
        if (!userDoc.exists()) {
          showAlert('ไม่พบข้อมูลผู้ใช้งานในระบบ', 'error');
          return;
        }

        const userData = userDoc.data();

        // ตรวจสอบการอนุมัติสิทธิ์
        if (userData.status === 'pending_approval') {
          showAlert('บัญชีของคุณอยู่ระหว่างรอ Admin อนุมัติการใช้งาน', 'warning');
          return;
        }

        if (userData.status === 'rejected') {
          showAlert('บัญชีนี้ถูกปฏิเสธการเข้าใช้งาน', 'error');
          return;
        }

        // เก็บ Session
        localStorage.setItem('stockmaster_user', JSON.stringify({
          uid: userData.uid,
          email: userData.email,
          name: userData.name,
          role: userData.role
        }));

        // Redirect ตาม Role จาก DB
        if (userData.role === 'admin') {
          window.location.href = 'admin-dashboard.html';
        } else {
          window.location.href = 'requisition.html';
        }

      } catch (err) {
        showAlert('อีเมลหรือรหัสผ่านไม่ถูกต้อง', 'error');
      }
    });
  </script>
</body>
</html>
