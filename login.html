<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockMaster - เข้าสู่ระบบ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="bg-white p-8 rounded-2xl shadow-xl border border-slate-200 w-full max-w-md">
    
    <!-- Logo & Title -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 rounded-2xl text-3xl mb-3">
        📦
      </div>
      <h1 class="text-2xl font-bold text-slate-800">StockMaster</h1>
      <p class="text-slate-500 text-sm mt-1" id="pageSubtitle">เข้าสู่ระบบเพื่อจัดการคลังสินค้า</p>
    </div>

    <!-- Toggle Login / Register Tabs -->
    <div class="flex bg-slate-100 p-1 rounded-xl mb-6">
      <button id="tabLogin" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-white text-blue-600 shadow-sm transition">
        เข้าสู่ระบบ
      </button>
      <button id="tabRegister" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-500 hover:text-slate-700 transition">
        ลงทะเบียนใหม่
      </button>
    </div>

    <!-- 1. LOGIN FORM -->
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">อีเมล</label>
        <input type="email" id="loginEmail" required placeholder="name@example.com"
          class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>

      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="block text-xs font-semibold text-slate-700">รหัสผ่าน</label>
          
        </div>
        <input type="password" id="loginPassword" required placeholder="••••••••"
          class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>

      <div class="flex items-center justify-between">
      <!-- กลุ่มเช็คบ็อกซ์ + ข้อความให้อยู่ติดกัน -->
      <label class="flex items-center space-x-2 cursor-pointer">
        <input type="checkbox" id="rememberMe" class="w-4 h-4 text-blue-600 border-slate-300 rounded focus:ring-blue-500">
        <span class="text-xs text-slate-600">จดจำการเข้าสู่ระบบ</span>
      </label>

      <!-- ปุ่มลืมรหัสผ่านอยู่ชิดขวา -->
      <button type="button" id="btnForgotPassword" class="text-xs text-blue-600 hover:underline">
        ลืมรหัสผ่าน?
      </button>
    </div>

      <button type="submit" id="btnLogin"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-xl transition shadow hover:shadow-lg">
        เข้าสู่ระบบ
      </button>
    </form>

    <!-- 2. REGISTER FORM -->
    <form id="registerForm" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">ชื่อ - นามสกุล</label>
        <input type="text" id="regName" required placeholder="สมชาย ใจดี"
          class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">อีเมล</label>
        <input type="email" id="regEmail" required placeholder="name@example.com"
          class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)</label>
        <input type="password" id="regPassword" minlength="6" required placeholder="••••••••"
          class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>

      <button type="submit" id="btnRegister"
        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-xl transition shadow hover:shadow-lg">
        สมัครสมาชิก (รอ Admin อนุมัติ)
      </button>
    </form>

    <!-- Divider -->
    <div class="relative my-6">
      <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200"></div></div>
      <div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-2 text-slate-400">หรือ</span></div>
    </div>

    <!-- Google Sign-In -->
    <button type="button" id="btnGoogle"
      class="w-full border border-slate-300 hover:bg-slate-50 text-slate-700 font-medium py-2.5 rounded-xl transition flex items-center justify-center space-x-2">
      <svg class="w-4 h-4" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <span>เข้าสู่ระบบด้วย Google</span>
    </button>

  </div>

  <!-- Forgot Password Modal -->
  <div id="forgotModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl space-y-4">
      <h3 class="font-bold text-slate-800 text-lg">รีเซ็ตรหัสผ่าน</h3>
      <p class="text-xs text-slate-500">กรอกอีเมลของคุณ ระบบจะส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ไปให้</p>
      <input type="email" id="resetEmail" placeholder="name@example.com"
        class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
      <div class="flex justify-end space-x-2 pt-2">
        <button type="button" id="btnCancelReset" class="px-4 py-2 text-xs font-semibold text-slate-500 hover:text-slate-700">ยกเลิก</button>
        <button type="button" id="btnSendReset" class="px-4 py-2 text-xs font-semibold bg-blue-600 text-white rounded-lg hover:bg-blue-700">ส่งลิงก์รีเซ็ต</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./js/firebase-config.js";
    import { 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword,
      signInWithPopup,
      GoogleAuthProvider,
      sendPasswordResetEmail,
      setPersistence,
      browserLocalPersistence,
      browserSessionPersistence
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { doc, getDoc, setDoc, Timestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // DOM Elements
    const tabLogin = document.getElementById("tabLogin");
    const tabRegister = document.getElementById("tabRegister");
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const pageSubtitle = document.getElementById("pageSubtitle");
    
    const btnLogin = document.getElementById("btnLogin");
    const btnRegister = document.getElementById("btnRegister");
    const btnGoogle = document.getElementById("btnGoogle");
    
    const forgotModal = document.getElementById("forgotModal");
    const btnForgotPassword = document.getElementById("btnForgotPassword");
    const btnCancelReset = document.getElementById("btnCancelReset");
    const btnSendReset = document.getElementById("btnSendReset");

    // Toggle Tabs
    tabLogin.addEventListener("click", () => {
      tabLogin.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-white text-blue-600 shadow-sm transition";
      tabRegister.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-500 hover:text-slate-700 transition";
      loginForm.classList.remove("hidden");
      registerForm.classList.add("hidden");
      pageSubtitle.textContent = "เข้าสู่ระบบเพื่อจัดการคลังสินค้า";
    });

    tabRegister.addEventListener("click", () => {
      tabRegister.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-white text-emerald-600 shadow-sm transition";
      tabLogin.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-500 hover:text-slate-700 transition";
      registerForm.classList.remove("hidden");
      loginForm.classList.add("hidden");
      pageSubtitle.textContent = "ลงทะเบียนเพื่อขออนุมัติเข้าใช้งานระบบ";
    });

    // Check User Role & Redirect
    async function checkUserAndRedirect(user) {
      const userDoc = await getDoc(doc(db, "users", user.uid));

      if (!userDoc.exists()) {
        await setDoc(doc(db, "users", user.uid), {
          name: user.displayName || user.email.split('@')[0],
          email: user.email,
          role: "user",
          status: "pending_approval",
          createdAt: Timestamp.now()
        });
        alert("ลงทะเบียนสำเร็จ! บัญชีของคุณกำลังอยู่ในระหว่างรอ Admin อนุมัติการใช้งาน");
        await auth.signOut();
        return;
      }

      const userData = userDoc.data();

      if (userData.status === "pending_approval") {
        alert("บัญชีของคุณกำลังอยู่ในระหว่างรอ Admin อนุมัติการใช้งาน");
        await auth.signOut();
        return;
      }

      if (userData.status === "rejected") {
        alert("บัญชีของคุณถูกปฏิเสธการเข้าใช้งาน กรุณาติดต่อผู้ดูแลระบบ");
        await auth.signOut();
        return;
      }

      // สถานะ approved -> แยกสาย redirect
      if (userData.role === "admin") {
        window.location.href = "approvals.html";
      } else {
        window.location.href = "index.html"; // Redirect ไปยังหน้า Dashboard
      }
    }

    // Login Form Event
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;
      const rememberMe = document.getElementById("rememberMe").checked;

      btnLogin.disabled = true;
      btnLogin.textContent = "กำลังเข้าสู่ระบบ...";

      try {
        const persistenceType = rememberMe ? browserLocalPersistence : browserSessionPersistence;
        await setPersistence(auth, persistenceType);

        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        await checkUserAndRedirect(userCredential.user);

      } catch (error) {
        alert("เข้าสู่ระบบไม่สำเร็จ: " + error.message);
      } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = "เข้าสู่ระบบ";
      }
    });

    // Register Form Event
    registerForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPassword").value;

      btnRegister.disabled = true;
      btnRegister.textContent = "กำลังลงทะเบียน...";

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        await setDoc(doc(db, "users", user.uid), {
          name: name,
          email: email,
          role: "user",
          status: "pending_approval",
          createdAt: Timestamp.now()
        });

        alert("ลงทะเบียนเรียบร้อยแล้ว! กรุณารอ Admin อนุมัติสิทธิ์ก่อนเข้าใช้งาน");
        await auth.signOut();

        tabLogin.click();
        registerForm.reset();

      } catch (error) {
        alert("ลงทะเบียนไม่สำเร็จ: " + error.message);
      } finally {
        btnRegister.disabled = false;
        btnRegister.textContent = "สมัครสมาชิก (รอ Admin อนุมัติ)";
      }
    });

    // Google Sign-In Event
    btnGoogle.addEventListener("click", async () => {
      const provider = new GoogleAuthProvider();
      try {
        const result = await signInWithPopup(auth, provider);
        await checkUserAndRedirect(result.user);
      } catch (error) {
        alert("เข้าสู่ระบบด้วย Google ไม่สำเร็จ: " + error.message);
      }
    });

    // Forgot Password Events
    btnForgotPassword.addEventListener("click", () => forgotModal.classList.remove("hidden"));
    btnCancelReset.addEventListener("click", () => forgotModal.classList.add("hidden"));

    btnSendReset.addEventListener("click", async () => {
      const email = document.getElementById("resetEmail").value.trim();
      if (!email) {
        alert("กรุณากรอกอีเมล");
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        alert("ส่งลิงก์รีเซ็ตรหัสผ่านไปยังอีเมลของคุณแล้ว");
        forgotModal.classList.add("hidden");
      } catch (error) {
        alert("เกิดข้อผิดพลาด: " + error.message);
      }
    });
    // 🔔 เพิ่มส่วนนี้ต่อท้ายใน <script type="module"> ของ login.html
window.addEventListener("DOMContentLoaded", () => {
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get("loggedOut") === "true") {
    alert("ออกจากระบบเรียบร้อยแล้ว");
    // ลบ parameter ออกจาก URL เพื่อไม่ให้แจ้งเตือนซ้ำเวลา Refresh
    window.history.replaceState({}, document.title, window.location.pathname);
  }
});
  </script>
</body>
</html>
