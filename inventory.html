<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockMaster - จัดการสต็อกสินค้า</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

<nav class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      
      <a href="index.html" class="flex items-center space-x-3">
        <div class="bg-blue-600 p-2 rounded-xl text-white font-black text-lg tracking-wider">SM</div>
        <span class="font-bold text-lg tracking-tight">StockMaster</span>
      </a>

      <!-- เมนูหลักตามสิทธิ์ -->
      <div class="hidden md:flex items-center space-x-1">
        <a href="index.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition">หน้าหลัก/สต็อก</a>
        <a href="requisition.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition">เบิกสินค้า</a>
        <a href="history.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition">ประวัติการเบิก</a>
        
        <!-- สำหรับ Manager และ Admin -->
        <a href="approvals.html" class="manager-only hidden px-3 py-2 rounded-lg text-sm font-medium text-amber-400 hover:bg-slate-800 transition">⏳ อนุมัติคำขอ</a>
        <a href="admin-unregistered-skus.html" class="manager-only hidden px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition">📦 รับสินค้าเข้า & คัดแยก</a>
        
        <!-- สำหรับ Admin เท่านั้น -->
        <a href="admin-users.html" class="admin-only hidden px-3 py-2 rounded-lg text-sm font-medium bg-purple-600 text-white hover:bg-purple-700 transition">👥 จัดการผู้ใช้</a>
      </div>

      <div class="flex items-center space-x-3">
        <span id="userDisplayName" class="text-xs text-slate-300 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700 font-mono">Loading...</span>
        <button id="btnLogout" class="text-xs text-rose-400 hover:text-rose-300 font-semibold px-2 py-1 transition">ออกจากระบบ</button>
      </div>

    </div>
  </div>
</nav>

  <main class="max-w-7xl mx-auto px-4 py-8 space-y-6">
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">คลังสินค้าและพัสดุ</h1>
        <p class="text-slate-500 text-xs mt-1">จัดการ เพิ่ม/แก้ไข รายการพัสดุในระบบ</p>
      </div>
      <!-- ปุ่มเปิด Modal เพิ่มสต็อก -->
      <button id="btnOpenAddStock" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2.5 rounded-xl transition shadow text-sm flex items-center space-x-2">
        <span>+ เพิ่มพัสดุเข้าสต็อก (หลายรายการ)</span>
      </button>
    </div>

    <!-- ตารางแสดงรายการสต็อกสินค้า -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-600">
          <thead class="bg-slate-100 text-slate-700 text-xs uppercase">
            <tr>
              <th class="px-6 py-3.5">ชื่อพัสดุ/อุปกรณ์</th>
              <th class="px-6 py-3.5">หมวดหมู่</th>
              <th class="px-6 py-3.5 text-center">คงเหลือ</th>
              <th class="px-6 py-3.5 text-center">หน่วยนับ</th>
              <th class="px-6 py-3.5 text-center">จัดการ</th>
            </tr>
          </thead>
          <tbody id="inventoryTableBody" class="divide-y divide-slate-100">
            <tr><td colspan="5" class="px-6 py-8 text-center text-slate-400">กำลังโหลดรายการสินค้า...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- 📦 Bulk Add Stock Modal (ฟอร์มกรอกทีละหลายรายการ) -->
  <div id="stockModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-6 max-w-3xl w-full shadow-2xl space-y-4 max-h-[90vh] flex flex-col">
      
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-slate-800 text-lg">📦 เพิ่มพัสดุเข้าสต็อก (กรอกหลายรายการได้)</h3>
        <button id="btnCloseStockModal" class="text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
      </div>

      <!-- ฟอร์มตารางป้อนข้อมูล -->
      <form id="bulkStockForm" class="space-y-4 flex-1 overflow-y-auto pr-1">
        <div class="space-y-3" id="stockItemsContainer">
          <!-- แถวป้อนข้อมูลเริ่มต้น -->
          <div class="grid grid-cols-12 gap-2 items-center bg-slate-50 p-3 rounded-xl border border-slate-200 stock-row">
            <div class="col-span-4">
              <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">ชื่อพัสดุ/อุปกรณ์</label>
              <input type="text" class="item-name w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="เช่น กระดาษ A4" required>
            </div>
            <div class="col-span-3">
              <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">หมวดหมู่</label>
              <input type="text" class="item-category w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="อุปกรณ์สำนักงาน">
            </div>
            <div class="col-span-2">
              <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">จำนวน</label>
              <input type="number" min="1" value="1" class="item-qty w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none text-center" required>
            </div>
            <div class="col-span-2">
              <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">หน่วยนับ</label>
              <input type="text" class="item-unit w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="รีม/กล่อง" required>
            </div>
            <div class="col-span-1 text-center pt-4">
              <button type="button" class="btn-remove-row text-rose-500 hover:text-rose-700 font-bold text-lg">&times;</button>
            </div>
          </div>
        </div>

        <button type="button" id="btnAddRow" class="w-full py-2.5 border-2 border-dashed border-blue-300 text-blue-600 hover:bg-blue-50 rounded-xl font-medium text-xs transition">
          + เพิ่มช่องกรอกพัสดุอีกรายการ
        </button>

        <div class="flex justify-end space-x-2 pt-3 border-t">
          <button type="button" id="btnCancelStock" class="px-4 py-2 text-xs font-semibold text-slate-500 hover:text-slate-700">ยกเลิก</button>
          <button type="submit" id="btnSaveStock" class="px-5 py-2 text-xs font-semibold bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl shadow">บันทึกเข้าสต็อกทั้งหมด</button>
        </div>
      </form>

    </div>
  </div>

  <script type="module">
    import { auth, db } from "./js/firebase-config.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { collection, getDocs, addDoc, doc, deleteDoc, Timestamp, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const inventoryTableBody = document.getElementById("inventoryTableBody");
    const stockModal = document.getElementById("stockModal");
    const btnOpenAddStock = document.getElementById("btnOpenAddStock");
    const btnCloseStockModal = document.getElementById("btnCloseStockModal");
    const btnCancelStock = document.getElementById("btnCancelStock");
    const btnAddRow = document.getElementById("btnAddRow");
    const stockItemsContainer = document.getElementById("stockItemsContainer");
    const bulkStockForm = document.getElementById("bulkStockForm");
    const btnLogout = document.getElementById("btnLogout");

    // ตรวจสอบสิทธิ์ Admin
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      const userDoc = await getDoc(doc(db, "users", user.uid));
      if (!userDoc.exists() || userDoc.data().role !== "admin") {
        alert("คุณไม่มีสิทธิ์เข้าถึงหน้านี้");
        window.location.href = "index.html";
        return;
      }

      loadInventory();
    });

    // โหลดตารางรายการพัสดุ
    async function loadInventory() {
      try {
        const snapshot = await getDocs(collection(db, "inventory"));
        if (snapshot.empty) {
          inventoryTableBody.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-slate-400">ยังไม่มีพัสดุในระบบ</td></tr>`;
          return;
        }

        let html = "";
        snapshot.forEach((docSnap) => {
          const item = docSnap.data();
          html += `
            <tr class="hover:bg-slate-50/50">
              <td class="px-6 py-4 font-medium text-slate-800">${item.name}</td>
              <td class="px-6 py-4 text-slate-500">${item.category || "-"}</td>
              <td class="px-6 py-4 text-center font-bold text-blue-600">${item.quantity}</td>
              <td class="px-6 py-4 text-center text-slate-500">${item.unit}</td>
              <td class="px-6 py-4 text-center">
                <button onclick="deleteItem('${docSnap.id}')" class="text-rose-500 hover:text-rose-700 text-xs font-semibold">ลบ</button>
              </td>
            </tr>
          `;
        });
        inventoryTableBody.innerHTML = html;
      } catch (err) {
        console.error(err);
      }
    }

    // Modal Control
    btnOpenAddStock.addEventListener("click", () => stockModal.classList.remove("hidden"));
    [btnCloseStockModal, btnCancelStock].forEach(btn => btn?.addEventListener("click", () => stockModal.classList.add("hidden")));

    // เพิ่มแถวกรอกพัสดุ
    btnAddRow.addEventListener("click", () => {
      const rowHtml = `
        <div class="grid grid-cols-12 gap-2 items-center bg-slate-50 p-3 rounded-xl border border-slate-200 stock-row">
          <div class="col-span-4">
            <input type="text" class="item-name w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="เช่น ปากกาเคมี" required>
          </div>
          <div class="col-span-3">
            <input type="text" class="item-category w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="เครื่องเขียน">
          </div>
          <div class="col-span-2">
            <input type="number" min="1" value="1" class="item-qty w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none text-center" required>
          </div>
          <div class="col-span-2">
            <input type="text" class="item-unit w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="ด้าม" required>
          </div>
          <div class="col-span-1 text-center">
            <button type="button" class="btn-remove-row text-rose-500 hover:text-rose-700 font-bold text-lg">&times;</button>
          </div>
        </div>
      `;
      stockItemsContainer.insertAdjacentHTML("beforeend", rowHtml);
    });

    // ลบแถว
    stockItemsContainer.addEventListener("click", (e) => {
      if (e.target.classList.contains("btn-remove-row")) {
        const rows = stockItemsContainer.querySelectorAll(".stock-row");
        if (rows.length > 1) {
          e.target.closest(".stock-row").remove();
        } else {
          alert("ต้องมีอย่างน้อย 1 รายการครับ");
        }
      }
    });

    // บันทึกรายการพัสดุทั้งหมดเข้า Firestore
    bulkStockForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const rows = stockItemsContainer.querySelectorAll(".stock-row");
      const btnSave = document.getElementById("btnSaveStock");

      btnSave.disabled = true;
      btnSave.textContent = "กำลังบันทึก...";

      try {
        const promises = Array.from(rows).map(row => {
          return addDoc(collection(db, "inventory"), {
            name: row.querySelector(".item-name").value.trim(),
            category: row.querySelector(".item-category").value.trim() || "ทั่วไป",
            quantity: Number(row.querySelector(".item-qty").value),
            unit: row.querySelector(".item-unit").value.trim(),
            updatedAt: Timestamp.now()
          });
        });

        await Promise.all(promises);

        alert("บันทึกพัสดุเข้าสต็อกเรียบร้อยแล้ว!");
        stockModal.classList.add("hidden");
        bulkStockForm.reset();
        loadInventory();

      } catch (error) {
        alert("เกิดข้อผิดพลาดในการบันทึก: " + error.message);
      } finally {
        btnSave.disabled = false;
        btnSave.textContent = "บันทึกเข้าสต็อกทั้งหมด";
      }
    });

    // ลบสินค้า
    window.deleteItem = async (id) => {
      if (!confirm("คุณต้องการลบพัสดุรายการนี้หรือไม่?")) return;
      await deleteDoc(doc(db, "inventory", id));
      loadInventory();
    };

    // Logout Action
    btnLogout.addEventListener("click", async () => {
      if (confirm("คุณต้องการออกจากระบบใช่หรือไม่?")) {
        await signOut(auth);
        window.location.href = "login.html?loggedOut=true";
      }
    });
  </script>
</body>
</html>
