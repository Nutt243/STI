<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockMaster - จัดการสต็อกสินค้า</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans" style="display: none;">

<nav class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      
      <a href="index.html" class="flex items-center space-x-3">
        <div class="bg-blue-600 p-2 rounded-xl text-white font-black text-lg tracking-wider">SM</div>
        <span class="font-bold text-lg tracking-tight">StockMaster</span>
      </a>

      <div class="hidden md:flex items-center space-x-1">
        <a href="index.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition">หน้าหลัก/สต็อก</a>
        <a href="requisition.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition">เบิกสินค้า</a>
        <a href="history.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition">ประวัติการเบิก</a>
        
        <a href="approvals.html" class="manager-only hidden px-3 py-2 rounded-lg text-sm font-medium text-amber-400 hover:bg-slate-800 transition">⏳ อนุมัติคำขอ</a>
        <a href="admin-unregistered-skus.html" class="manager-only hidden px-3 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition">📦 รับสินค้าเข้า & คัดแยก</a>
        
        <a href="admin-users.html" class="admin-only hidden px-3 py-2 rounded-lg text-sm font-medium bg-purple-600 text-white hover:bg-purple-700 transition">👥 จัดการผู้ใช้</a>
      </div>

      <div class="flex items-center space-x-3">
        <span id="userDisplayName" class="text-xs text-slate-300 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700 font-mono">Loading...</span>
        <button id="btnLogout" class="text-xs text-rose-400 hover:text-rose-300 font-semibold px-2 py-1 transition">ออกจากระบบ</button>
      </div>

    </div>
  </div>
</nav>

  <main class="max-w-7xl mx-auto px-4 py-8 space-y-6">
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">คลังสินค้าและพัสดุ</h1>
        <p class="text-slate-500 text-xs mt-1">รายการพัสดุทั้งหมดแยกตาม SKU ในระบบ</p>
      </div>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-600">
          <thead class="bg-slate-100 text-slate-700 text-xs uppercase">
            <tr>
              <th class="px-6 py-3.5">SKU / ชื่อพัสดุ</th>
              <th class="px-6 py-3.5">คุณลักษณะเฉพาะ</th>
              <th class="px-6 py-3.5 text-center">คงเหลือ</th>
              <th class="px-6 py-3.5 text-center">หน่วยนับ</th>
              <th class="px-6 py-3.5 text-center">จัดการ</th>
            </tr>
          </thead>
          <tbody id="inventoryTableBody" class="divide-y divide-slate-100">
            <tr><td colspan="5" class="px-6 py-8 text-center text-slate-400">กำลังโหลดรายการสินค้า...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import { checkUserAuth } from "./js/auth.js";
    import { collection, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    checkUserAuth(['admin']);

    async function loadInventory() {
      const tbody = document.getElementById("inventoryTableBody");
      try {
        const skuSnap = await getDocs(collection(db, "skus"));
        const skus = new Map();
        skuSnap.forEach(d => skus.set(d.id, d.data()));

        const snapshot = await getDocs(collection(db, "products"));
        if (snapshot.empty) {
          tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-slate-400">ยังไม่มีพัสดุในระบบ</td></tr>`;
          return;
        }

        let html = "";
        snapshot.forEach((docSnap) => {
          const item = docSnap.data();
          const skuInfo = skus.get(item.sku_id) || { sku_name: "ไม่ระบุ SKU", unit: "ชิ้น" };
          const attrSummary = Object.entries(item.specific_attributes || {}).map(([k,v]) => `${k}:${v}`).join(", ") || "ทั่วไป";

          html += `
            <tr class="hover:bg-slate-50/50">
              <td class="px-6 py-4 font-medium text-slate-800">${skuInfo.sku_name}</td>
              <td class="px-6 py-4 text-slate-500">${attrSummary}</td>
              <td class="px-6 py-4 text-center font-bold text-blue-600">${item.quantity || 0}</td>
              <td class="px-6 py-4 text-center text-slate-500">${skuInfo.unit || 'ชิ้น'}</td>
              <td class="px-6 py-4 text-center">
                <button onclick="deleteItem('${docSnap.id}')" class="text-rose-500 hover:text-rose-700 text-xs font-semibold">ลบ</button>
              </td>
            </tr>
          `;
        });
        tbody.innerHTML = html;
      } catch (err) {
        console.error(err);
        tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-rose-500">เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>`;
      }
    }

    window.deleteItem = async (id) => {
      if (!confirm("คุณต้องการลบพัสดุรายการนี้หรือไม่?")) return;
      await deleteDoc(doc(db, "products", id));
      loadInventory();
    };

    loadInventory();
  </script>
</body>
</html>
