<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockMaster - จัดการผู้ใช้งาน</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Navbar -->
  <nav class="bg-slate-900 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-6">
        <span class="text-2xl font-bold text-blue-400">📦 StockMaster</span>
        <div class="hidden md:flex space-x-4 text-sm">
          <a href="requisition.html" class="hover:text-blue-300 py-1">ขอเบิกสินค้า</a>
          <a href="history.html" class="hover:text-blue-300 py-1">ประวัติการเบิก</a>
          <a href="approvals.html" class="hover:text-blue-300 py-1 admin-only">รายการรออนุมัติ</a>
          <a href="admin-unregistered-skus.html" class="hover:text-blue-300 py-1 admin-only">รอจัดหมวดหมู่</a>
          <a href="admin-dashboard.html" class="hover:text-blue-300 py-1 admin-only">จัดการสต็อก</a>
          <a href="admin-users.html" class="text-blue-400 border-b-2 border-blue-400 font-semibold py-1 admin-only">จัดการผู้ใช้</a>
        </div>
      </div>
      <div class="flex items-center space-x-4">
        <span id="userDisplayName" class="text-sm text-slate-300"></span>
        <button id="btnLogout" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-sm transition">
          ออกจากระบบ
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow">
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-slate-800">จัดการผู้ใช้งานและสิทธิ์เข้าถึง</h1>
      <p class="text-slate-500 text-sm">อนุมัติสมาชิกใหม่ ปรับเปลี่ยนสิทธิ์ (Role) หรือระงับบัญชีผู้ใช้</p>
    </div>

    <div class="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-slate-800 text-slate-200 text-sm">
            <th class="p-4">อีเมล / UID</th>
            <th class="p-4">ชื่อ-นามสกุล</th>
            <th class="p-4">สิทธิ์ (Role)</th>
            <th class="p-4">สถานะ</th>
            <th class="p-4 text-center">จัดการ</th>
          </tr>
        </thead>
        <tbody id="usersTableBody" class="divide-y divide-slate-100 text-sm">
          <tr><td colspan="5" class="p-8 text-center text-slate-400">กำลังโหลดรายการผู้ใช้งาน...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script type="module">
    import { db } from "./js/firebase-config.js";
    import { checkUserAuth } from "./js/auth.js";
    import { collection, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    checkUserAuth(['admin']);

    async function loadUsers() {
      const tableBody = document.getElementById("usersTableBody");
      try {
        const querySnapshot = await getDocs(collection(db, "users"));
        let html = "";

        querySnapshot.forEach(docSnap => {
          const user = docSnap.data();
          const uid = docSnap.id;
          const isPending = user.status === "pending_approval";

          html += `
            <tr class="hover:bg-slate-50 border-b border-slate-100">
              <td class="p-4 font-mono text-slate-700">${user.email || uid}</td>
              <td class="p-4 font-medium text-slate-800">${user.name || '-'}</td>
              <td class="p-4"><span class="px-2 py-0.5 bg-slate-100 text-slate-700 rounded font-semibold text-xs">${user.role || 'user'}</span></td>
              <td class="p-4">
                <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${
                  user.status === 'approved' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
                }">
                  ${user.status || 'pending'}
                </span>
              </td>
              <td class="p-4 text-center space-x-2">
                ${isPending ? `
                  <button onclick="updateUserStatus('${uid}', 'approved')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1 rounded text-xs">อนุมัติ</button>
                  <button onclick="updateUserStatus('${uid}', 'rejected')" class="bg-red-500 hover:bg-red-600 text-white px-2.5 py-1 rounded text-xs">ปฏิเสธ</button>
                ` : `
                  <button onclick="toggleRole('${uid}', '${user.role}')" class="text-blue-600 hover:underline text-xs font-semibold">เปลี่ยน Role</button>
                `}
              </td>
            </tr>
          `;
        });

        tableBody.innerHTML = html;

      } catch (err) {
        tableBody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-red-500">เกิดข้อผิดพลาด: ${err.message}</td></tr>`;
      }
    }

    window.updateUserStatus = async (uid, status) => {
      await updateDoc(doc(db, "users", uid), { status });
      alert(`อัปเดตสถานะเป็น ${status} เรียบร้อยแล้ว`);
      loadUsers();
    };

    window.toggleRole = async (uid, currentRole) => {
      const newRole = currentRole === "admin" ? "user" : "admin";
      if (confirm(`สลับสิทธิ์ผู้ใช้งานเป็น ${newRole}?`)) {
        await updateDoc(doc(db, "users", uid), { role: newRole });
        loadUsers();
      }
    };

    loadUsers();
  </script>
</body>
</html>
